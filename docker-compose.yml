services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: login_app
    ports:
      - "3307:3306"
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=864000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-connect:
    image: debezium/connect:2.7.0.Final
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy

  connector-init:
    image: curlimages/curl:latest
    depends_on:
      kafka-connect:
        condition: service_started
    entrypoint: >
      sh -c "
        echo 'Waiting for Kafka Connect to be ready...';
        while ! curl -s -f http://kafka-connect:8083/connectors > /dev/null; do
          echo 'Kafka Connect not ready yet. Sleeping 5 seconds...';
          sleep 5;
        done;
        echo 'Kafka Connect is up! Registering MySQL connector...';
        curl -s -f -X POST -H 'Content-Type: application/json' http://kafka-connect:8083/connectors -d '{
          \"name\": \"mysql-connector\",
          \"config\": {
            \"connector.class\": \"io.debezium.connector.mysql.MySqlConnector\",
            \"database.hostname\": \"mysql\",
            \"database.port\": \"3306\",
            \"database.user\": \"root\",
            \"database.password\": \"rootpassword\",
            \"database.server.id\": \"1\",
            \"topic.prefix\": \"dbserver1\",
            \"database.include.list\": \"login_app\",
            \"schema.history.internal.kafka.topic\": \"schemahistory.login_app\",
            \"schema.history.internal.kafka.bootstrap.servers\": \"kafka:9092\"
          }
        }'
      "

  api:
    build: ./api
    ports:
      - "3001:3000"
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=login_app
      - DB_PORT=3306
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

  consumer:
    build: ./consumer
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=dbserver1.login_app.users 
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  mysql_data: